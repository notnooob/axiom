<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Axiom: a CAS handheld in your browser</title>
  <desc id="desc">The Axiom name and tagline beside a drawing of the calculator screen: page tabs 1.1 and 1.2 and a history of three worked entries, solve, a definite integral and a derivative, each with its exact result.</desc>

  <defs>
    <radialGradient id="light" cx="0.62" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen-clip">
      <rect width="452" height="292" rx="6"/>
    </clipPath>
  </defs>

  <!-- Stage: the site's #121212 page, with its soft light. -->
  <rect width="1200" height="400" rx="28" fill="#121212"/>
  <rect width="1200" height="400" rx="28" fill="url(#light)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#5aaee6">OPEN-SOURCE CAS · RUNS IN THE BROWSER</text>
    <text x="-4" y="190" font-size="104" font-weight="700" letter-spacing="-4" fill="#f0f0f0">Axiom</text>
    <text x="0" y="244" font-size="31" font-weight="600" fill="#f0f0f0">A CAS handheld in your browser.</text>
    <text x="0" y="284" font-size="22" fill="#a3a3a3">Calculator, Graphs, Lists, Data &amp; Statistics,</text>
    <text x="0" y="314" font-size="22" fill="#a3a3a3">Notes and Python, with .tns documents in and out.</text>
    <text x="0" y="344" font-size="22" fill="#a3a3a3">No sign-in, no server, no trackers.</text>
  </g>

  <!-- The calculator's screen, drawn: the device body, the page tabs, three worked entries. -->
  <g id="project-proof" transform="translate(674 54)">
    <rect x="-18" y="-18" width="488" height="328" rx="24" fill="#18191b" stroke="#ffffff" stroke-opacity="0.07"/>
    <g clip-path="url(#screen-clip)">
      <rect width="452" height="292" fill="#ffffff"/>
      <!-- Top bar with page tabs -->
      <rect width="452" height="50" fill="#3d3d3d"/>
      <path d="M14 25 l9 -8 v16 z" fill="#3d9fd8"/>
      <rect x="30" y="12" width="56" height="38" fill="#c4c4c4"/>
      <text x="58" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#0a0a0a">1.1</text>
      <rect x="90" y="6" width="56" height="44" fill="#f4f4f4"/>
      <text x="118" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#0a0a0a">1.2</text>
      <text x="292" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#ffffff">Axiom</text>
      <text x="404" y="33" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#ffffff">RAD</text>
      <rect x="414" y="16" width="11" height="20" rx="2" fill="#3cb043" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M432 17 l12 12 M444 17 l-12 12" stroke="#ffffff" stroke-width="2.2"/>

      <!-- History: input on the left, the exact result on the right, as the screen lays it out. -->
      <g font-family="'STIX Two Text', 'STIX Two Math', 'Cambria Math', Cambria, Georgia, 'Times New Roman', serif" font-size="24" fill="#0a0a0a">
        <rect y="50" width="452" height="62" fill="#f2f2f2"/>
        <text x="16" y="90">solve(<tspan font-style="italic">x</tspan>²−5<tspan font-style="italic">x</tspan>+6=0,<tspan font-style="italic">x</tspan>)</text>
        <text x="436" y="90" text-anchor="end"><tspan font-style="italic">x</tspan> = 2 or <tspan font-style="italic">x</tspan> = 3</text>

        <text x="16" y="152">∫₀³ <tspan font-style="italic">x</tspan>² d<tspan font-style="italic">x</tspan></text>
        <text x="436" y="152" text-anchor="end">9</text>

        <rect y="174" width="452" height="62" fill="#f2f2f2"/>
        <text x="16" y="214">d/d<tspan font-style="italic">x</tspan> (<tspan font-style="italic">x</tspan>³ − 6<tspan font-style="italic">x</tspan>)</text>
        <text x="436" y="214" text-anchor="end">3<tspan font-style="italic">x</tspan>² − 6</text>
      </g>
      <!-- The entry line, waiting. -->
      <rect x="16" y="252" width="2" height="26" fill="#0a0a0a"/>
    </g>
  </g>
</svg>
